<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunnah Habits</title>
    <meta
      name="description"
      content="Sunnah Habits — one Sunnah at a time, with the hadith it rests on. Everything stays on the phone."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f6f1;
        --card: #ffffff;
        --text: #1a1c1a;
        --muted: #55605a;
        --line: #e2ddd2;
        --link: #1f5c46;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --card: #1c1f24;
          --text: #eae7e0;
          --muted: #a2aba5;
          --line: #2c3138;
          --link: #7fcba8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 16px 64px;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.25;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      p.lead {
        color: var(--text);
      }
      nav {
        border-top: 1px solid var(--line);
        padding-top: 1.25rem;
      }
      nav a {
        display: block;
        padding: 0.65rem 0;
        color: var(--link);
        font-weight: 600;
        text-decoration: none;
      }
      nav a:hover,
      nav a:focus-visible,
      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
      }
      footer {
        margin-top: 2.5rem;
        border-top: 1px solid var(--line);
        padding-top: 1.25rem;
        font-size: 0.9rem;
        color: var(--muted);
      }
      footer a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sunnah Habits</h1>
      <p class="lead">
        One Sunnah at a time, with the hadith it rests on. Everything stays on the phone.
      </p>

      <nav aria-label="Pages">
        <a href="privacy">Privacy Policy</a>
        <a href="support">Support</a>
      </nav>

      <footer>
        Questions: <a href="mailto:birlikoff@gmail.com">birlikoff@gmail.com</a>
      </footer>
    </main>
  </body>
</html>
